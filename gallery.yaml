
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gallery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gallery
  template:
    metadata:
      labels:
        app: gallery
    spec:
      containers:
      - name: gallery
        image: gallery:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: gallery-service
spec:
  type: NodePort
  selector:
    app: gallery
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
